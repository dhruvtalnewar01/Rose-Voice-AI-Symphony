# Netlify Configuration for Rose Voice AI Symphony
# https://github.com/dhruvtalnewar01/Rose-Voice-AI-Symphony

[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Permissions & Security Policies (Required for Camera & Web Audio mic access)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"

# Real-Time SSE Token Streaming & Voice Chat Optimization
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-transform"
    X-Accel-Buffering = "no"

# Rewrites for API routes to Netlify Functions
[[redirects]]
  from = "/api/vision-analyze"
  to = "/.netlify/functions/vision-analyze"
  status = 200

[[redirects]]
  from = "/api/voice-stream"
  to = "/.netlify/functions/voice-stream"
  status = 200

[[redirects]]
  from = "/api/voice-chat"
  to = "/.netlify/functions/voice-chat"
  status = 200

[[redirects]]
  from = "/api/outbound-call"
  to = "/.netlify/functions/outbound-call"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
